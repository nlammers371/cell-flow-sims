[build-system]
# Setuptools 64 added the PEP 660 hook required by ``pip install -e``.
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-sphere-sim"
version = "0.1.0"
description = "Cell mechanics simulations in periodic 2D and on a sphere"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
sandbox = ["matplotlib"]
napari = ["napari", "qtpy", "magicgui"]

[project.entry-points."napari.manifest"]
sim_viewer = "sim_viewer:napari.yaml"

[tool.setuptools.packages.find]
where = ["."]
include = ["cell_sphere_sim*", "sim_viewer*"]

[tool.setuptools.package-data]
sim_viewer = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
